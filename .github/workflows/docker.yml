name: docker

# 打 tag（relay-v1.15.0）时构建多架构镜像并推到 GHCR：
#   ghcr.io/huueng/shouhu-relay:1.15.0 / :latest（owner 取自 github.repository_owner）
#
# 首次推送后，到仓库 Settings → Packages 里把镜像可见性设为 public（默认是 private）。

on:
  push:
    tags: ['relay-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不打 tag 手动跑时用）
        required: true
        default: '1.15.0'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#relay-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像名转小写
        id: repo
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/shouhu-relay" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: elder-guardian/relay
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ steps.repo.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
